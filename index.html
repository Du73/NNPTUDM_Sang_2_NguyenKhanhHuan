<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Posts & Comments</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
        section { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .deleted { text-decoration: line-through; color: #888; font-style: italic; }
        .item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .comment-item { margin-left: 20px; font-size: 0.9em; background: #fafafa; border-left: 3px solid #ddd; padding: 5px 10px; }
        button { cursor: pointer; margin-left: 5px; padding: 5px 10px; border: none; border-radius: 4px; }
        .btn-add { background: #28a745; color: white; }
        .btn-del { background: #dc3545; color: white; }
        .btn-edit { background: #ffc107; color: black; }
        input { padding: 8px; width: 200px; margin-right: 5px; }
    </style>
</head>
<body>

    <h2>Hệ thống Quản lý Nội dung</h2>

    <section>
        <h3>Quản lý Posts</h3>
        <div style="margin-bottom: 15px;">
            <input type="text" id="postTitle" placeholder="Tiêu đề bài viết">
            <input type="number" id="postViews" placeholder="Lượt xem" style="width: 80px;">
            <button class="btn-add" onclick="handleCreatePost()">Thêm Post mới</button>
        </div>
        <div id="postContainer"></div>
    </section>

    <section>
        <h3>Quản lý Comments</h3>
        <div style="margin-bottom: 15px;">
            <input type="text" id="commentText" placeholder="Nội dung bình luận">
            <input type="text" id="commentPostId" placeholder="ID Post">
            <button class="btn-add" onclick="handleCreateComment()">Gửi Bình luận</button>
        </div>
        <div id="commentContainer"></div>
    </section>

    <script>
        const API = "http://localhost:3000";

        // --- HELPER: ID TỰ TĂNG (DẠNG CHUỖI) ---
        const getNextId = (list) => {
            if (!list || list.length === 0) return "1";
            const numericIds = list.map(item => parseInt(item.id)).filter(id => !isNaN(id));
            if (numericIds.length === 0) return "1";
            return (Math.max(...numericIds) + 1).toString();
        };

        // --- POSTS LOGIC ---
        async function fetchPosts() {
            const res = await fetch(`${API}/posts`);
            const posts = await res.json();
            renderPosts(posts);
        }

        async function handleCreatePost() {
            const titleInput = document.getElementById('postTitle');
            const viewsInput = document.getElementById('postViews');
            
            const res = await fetch(`${API}/posts`);
            const currentPosts = await res.json();

            const newPost = {
                id: getNextId(currentPosts), // ID tự tăng dạng chuỗi
                title: titleInput.value,
                views: parseInt(viewsInput.value) || 0,
                isDeleted: false // Mặc định chưa xóa
            };

            await fetch(`${API}/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });
            titleInput.value = ''; viewsInput.value = '';
            fetchPosts();
        }

        async function softDeletePost(id) {
            await fetch(`${API}/posts/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isDeleted: true }) // Chuyển sang xóa mềm
            });
            fetchPosts();
        }

        function renderPosts(posts) {
            const container = document.getElementById('postContainer');
            container.innerHTML = posts.map(p => `
                <div class="item">
                    <span class="${p.isDeleted ? 'deleted' : ''}">
                        [ID: ${p.id}] <strong>${p.title}</strong> - ${p.views} views 
                        ${p.isDeleted ? '(Đã xóa)' : ''}
                    </span>
                    <div>
                        ${!p.isDeleted ? `<button class="btn-del" onclick="softDeletePost('${p.id}')">Xoá mềm</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // --- COMMENTS LOGIC (CRUD) ---
        async function fetchComments() {
            const res = await fetch(`${API}/comments`);
            const comments = await res.json();
            renderComments(comments);
        }

        async function handleCreateComment() {
            const textInput = document.getElementById('commentText');
            const postIdInput = document.getElementById('commentPostId');

            const res = await fetch(`${API}/comments`);
            const currentComments = await res.json();

            const newComment = {
                id: getNextId(currentComments),
                text: textInput.value,
                postId: postIdInput.value
            };

            await fetch(`${API}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newComment)
            });
            textInput.value = '';
            fetchComments();
        }

        async function deleteComment(id) {
            await fetch(`${API}/comments/${id}`, { method: 'DELETE' });
            fetchComments();
        }

        async function updateComment(id) {
            const newText = prompt("Nhập nội dung mới cho comment:");
            if (newText) {
                await fetch(`${API}/comments/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: newText })
                });
                fetchComments();
            }
        }

        function renderComments(comments) {
            const container = document.getElementById('commentContainer');
            container.innerHTML = comments.map(c => `
                <div class="item comment-item">
                    <span><strong>Post ${c.postId}:</strong> ${c.text} (ID: ${c.id})</span>
                    <div>
                        <button class="btn-edit" onclick="updateComment('${c.id}')">Sửa</button>
                        <button class="btn-del" onclick="deleteComment('${c.id}')">Xoá cứng</button>
                    </div>
                </div>
            `).join('');
        }

        // Khởi tạo dữ liệu khi load trang
        window.onload = () => {
            fetchPosts();
            fetchComments();
        };
    </script>
</body>
</html>
